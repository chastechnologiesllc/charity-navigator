<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Charity Navigator OG</title>
    <style>
      @font-face {
        font-family: Outfit;
        src: url("fonts/Outfit-ExtraBold.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #001936;
      }
      .stage {
        width: 1200px;
        height: 630px;
        position: relative;
        background:
          radial-gradient(ellipse 78% 72% at 50% 46%, #07305a 0%, #001936 58%, #000e1f 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Outfit, "Liberation Sans", sans-serif;
        color: #ffffff;
      }
      .stars {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .rings {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 920px;
        height: 920px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0.28;
      }
      .lockup {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .mark {
        width: 112px;
        height: 112px;
        margin-bottom: 22px;
        filter: drop-shadow(0 0 28px rgba(63, 93, 245, 0.55));
      }
      .word {
        font-weight: 800;
        font-size: 78px;
        line-height: 0.92;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 2px 24px rgba(0, 25, 54, 0.55);
      }
      .charity {
        letter-spacing: 0.34em;
        padding-left: 0.34em;
      }
      .navigator {
        letter-spacing: 0.08em;
        padding-left: 0.08em;
        margin-top: 4px;
      }
      .rule {
        width: 132px;
        height: 3px;
        margin: 22px 0 16px;
        background: #3f5df5;
        border-radius: 2px;
      }
      .tag {
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 0.38em;
        padding-left: 0.38em;
        text-transform: uppercase;
        color: #9eb0ff;
      }
      .rating {
        display: flex;
        gap: 8px;
        margin-top: 18px;
      }
      .rating span {
        width: 10px;
        height: 10px;
        background: #3f5df5;
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg class="stars" viewBox="0 0 1200 630" aria-hidden="true">
        <circle cx="86" cy="92" r="1.4" fill="#fff" opacity="0.55" />
        <circle cx="168" cy="210" r="1.1" fill="#fff" opacity="0.35" />
        <circle cx="240" cy="64" r="1.6" fill="#9eb0ff" opacity="0.5" />
        <circle cx="312" cy="520" r="1.2" fill="#fff" opacity="0.4" />
        <circle cx="390" cy="88" r="1.1" fill="#fff" opacity="0.3" />
        <circle cx="980" cy="110" r="1.5" fill="#fff" opacity="0.5" />
        <circle cx="1088" cy="188" r="1.2" fill="#9eb0ff" opacity="0.45" />
        <circle cx="1140" cy="420" r="1.4" fill="#fff" opacity="0.38" />
        <circle cx="1020" cy="540" r="1.1" fill="#fff" opacity="0.32" />
        <circle cx="140" cy="430" r="1.3" fill="#9eb0ff" opacity="0.4" />
        <circle cx="70" cy="300" r="1.1" fill="#fff" opacity="0.28" />
        <circle cx="880" cy="70" r="1.2" fill="#fff" opacity="0.36" />
      </svg>
      <svg class="rings" viewBox="0 0 920 920" aria-hidden="true">
        <circle cx="460" cy="460" r="210" fill="none" stroke="#3F5DF5" stroke-width="1.2" />
        <circle cx="460" cy="460" r="300" fill="none" stroke="#3F5DF5" stroke-width="1" />
        <circle cx="460" cy="460" r="390" fill="none" stroke="#3F5DF5" stroke-width="0.8" />
        <circle cx="460" cy="460" r="430" fill="none" stroke="#3F5DF5" stroke-width="0.6" opacity="0.7" />
      </svg>
      <div class="lockup">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <polygon points="16,1 19.2,16 16,31 12.8,16" fill="#FFFFFF" />
          <polygon points="1,16 16,12.8 31,16 16,19.2" fill="#3F5DF5" />
          <circle cx="16" cy="16" r="2.3" fill="#FFFFFF" />
        </svg>
        <div class="word charity">CHARITY</div>
        <div class="word navigator">NAVIGATOR</div>
        <div class="rule"></div>
        <div class="tag">Give with confidence</div>
        <div class="rating" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </body>
</html>
